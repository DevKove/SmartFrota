name: Publish SmartFrota static frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "terms.html"
      - "privacy.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icons/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static artifact only
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp terms.html dist/terms.html
          cp privacy.html dist/privacy.html
          cp manifest.webmanifest dist/manifest.webmanifest
          cp service-worker.js dist/service-worker.js
          cp -R icons dist/icons
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
